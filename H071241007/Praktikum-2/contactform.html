<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100;200;300;400;500;600;700;800;900&family=Roboto&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'montserrat': ['Montserrat'],
                    }
                }
            }
        }
    </script>
    <title>Contact Us - QSecThrift</title>
</head>

<body class="font-montserrat bg-gray-50">
    <nav class="bg-white w-full sticky top-0 shadow-md z-10" >
        <div class="flex justify-between space-x-1 px-8">
            <div>
                <a href="index.html" class="flex items-center py-4 px-2">
                    <img src="assets/images/logoqsec.png" alt="Logo" class="h-8 w-8 mr-2">
                    <span class=" font-bold text-blue-700 text-lg font-monserrat">QSecThrift</span>
                </a>
            </div>
            <div class="flex items-center space-x-1">
                <a href="index.html" class="font-bold py-4 px-2 text-blue-700 hover:text-amber-900 transition duration-300 font-montserrat">Home</a>
                <a href="contactform.html" class="font-bold py-4 px-2 text-blue-700 underline decoration-blue-700 underline-offset-4 decoration-2 transition duration-300 font-montserrat">Contact</a>
            </div>
        </div>
    </nav>

    <main class="container mx-auto px-6 py-16">
        <div class="max-w-2xl mx-auto bg-white p-8 rounded-lg shadow-lg">
            <h1 class="text-3xl font-bold text-blue-700 mb-2 text-center">Hubungi Kami</h1>
            <p class="text-gray-600 mb-8 text-center">Daftar, berlangganan, atau kirim pertanyaan Anda di bawah ini.</p>

            <form action="#" method="POST" class="space-y-6">
                <div>
                    <label for="whatsapp" class="block text-sm font-semibold text-gray-700 mb-2">Nomor WhatsApp</label>
                    <input type="tel" id="whatsapp" name="whatsapp" placeholder="Contoh: 081234567890" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500">
                </div>
                <div>
                    <label for="email" class="block text-sm font-semibold text-gray-700 mb-2">Alamat Email</label>
                    <input type="email" id="email" name="email" placeholder="anda@email.com" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500">
                </div>
                <div>
                    <label for="message" class="block text-sm font-semibold text-gray-700 mb-2">Saran atau Pertanyaan</label>
                    <textarea id="message" name="message" rows="5" placeholder="Tulis pesan Anda di sini..." class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500"></textarea>
                </div>
                <div>
                    <a href="#" target="_blank" class="w-full inline-block text-center bg-blue-700 text-white px-6 py-3 rounded-md font-semibold hover:bg-amber-900 transition duration-300">
                        Kirim Pesan
                    </a>
                </div>
            </form>
        </div>
    </main>

    <footer class="bg-blue-700 text-white py-8 mt-16">
        <div class="container mx-auto px-6 text-center">
            <p class="text-sm text-gray-300">&copy; 2024 QSecThrift. All Rights Reserved.</p>
        </div>
    </footer>
</body>
</html>
