<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>UNO — Versi Sederhana</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>UNO — Versi Sederhana</h1>
    </div>
    <div class="controls panel">
      <div style="text-align:right">
        <div class="muted">Saldo</div>
        <div style="font-weight:700;font-size:18px">$<span id="balance">5000</span></div>
      </div>
      <div style="margin-left:12px">
        <label class="muted">Taruhan</label><br>
        <input id="bet" type="number" min="100" value="100">
      </div>
      <div style="margin-left:12px;display:flex;flex-direction:column;gap:6px">
        <button id="startBtn">Mulai Ronde</button>
        <button id="resetBtn" class="ghost">Reset</button>
      </div>
    </div>
  </header>

  <div class="game-grid">
    <div class="area panel">
      <h3>Bot (Lawan)</h3>
      <div style="display:flex;justify-content:center;gap:12px;align-items:center;margin-top:8px">
        <div class="muted">Jumlah Kartu</div>
        <div style="font-weight:700;font-size:20px" id="botCount">0</div>
        <div class="muted">UNO: <span id="botUno">-</span></div>
      </div>
      <div style="text-align:center;margin-top:10px" class="muted">(Kartu Bot tidak ditampilkan)</div>
      <div style="text-align:center;margin-top:10px"><button id="callBotUno" class="small ghost">Panggil UNO pada Bot</button></div>
    </div>

    <div class="area panel center">
      <h3>Papan</h3>
      <div style="display:flex;gap:18px;align-items:center">
        <div style="text-align:center">
          <div class="muted">Deck (klik untuk ambil)</div>
          <div id="deck" class="deck"><img src="card_back.png" alt="deck" style="width:100%;height:100%;object-fit:cover"></div>
          <div class="muted" style="margin-top:6px">Sisa: <span id="deckCount">0</span></div>
        </div>

        <div style="text-align:center">
          <div class="muted">Discard (Teratas)</div>
          <div id="discard" class="discard"><div class="muted">-</div></div>
          <div style="margin-top:8px" class="muted">Warna Aktif: <strong id="activeColor">-</strong><span id="colorBadge" class="badge" style="display:none"></span></div>
        </div>
      </div>

      <div style="display:flex;gap:8px;margin-top:12px">
        <button id="drawBtn" class="small">Ambil Kartu</button>
        <button id="passBtn" class="small ghost">Lewati</button>
        <button id="showRules" class="small ghost">Aturan</button>
      </div>

      <div style="width:100%;margin-top:12px">
        <div class="muted">Log Aksi:</div>
        <div id="log" class="log"></div>
      </div>
    </div>

    <div class="area panel">
      <h3>Anda (Player)</h3>
      <div style="display:flex;gap:8px;align-items:center;justify-content:space-between">
        <div class="muted">Kartu Anda:</div>
        <div class="muted">UNO: <span id="playerUno">-</span></div>
      </div>
      <div class="hand" id="playerHand" style="margin-top:8px"></div>

      <div style="display:flex;gap:8px;justify-content:center;margin-top:10px">
        <button id="unoBtn" class="small" style="background:#ffcc00;color:#000;display:none">TOMBOL UNO</button>
        <button id="callPlayerBtn" class="small ghost">Panggil UNO pada Lawan</button>
      </div>
    </div>
  </div>
</div>

<div id="colorChooser" class="color-chooser">
  <div class="chooser panel">
    <div class="muted">Pilih warna untuk kartu yang dibuang</div>
    <div class="color-row">
      <div class="color-btn blue" data-color="blue">BIRU</div>
      <div class="color-btn red" data-color="red">MERAH</div>
      <div class="color-btn green" data-color="green">HIJAU</div>
      <div class="color-btn yellow" data-color="yellow">KUNING</div>
    </div>
    <div style="margin-top:8px"><button id="cancelChoose" class="small ghost">Batal</button></div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
