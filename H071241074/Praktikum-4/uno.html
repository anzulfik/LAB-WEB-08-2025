<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UNO Game</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            poppins: ['Poppins', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    #drawPile {
      position: relative !important;
      z-index: 9999 !important;
      pointer-events: auto !important;
    }

    #discardPile {
      z-index: 10 !important;
    }

    #drawPile:active {
      transform: scale(0.95);
      transition: transform 0.1s ease-in-out;
    }
    
  </style>
</head>
<body class="font-poppins font-semibold min-h-screen flex items-center justify-center bg-[url('asset/bg-uno.png')] bg-cover bg-center bg-fixed">
  <img src="asset/hiasan-card.png" class="absolute inset-0 w-full h-full object-cover opacity-50 z-0 select-none pointer-events-none" alt="UNO Background">

  <div id="gameArea" class="relative w-full max-w-7xl h-[90vh] rounded-2xl p-6 backdrop-blur-[2px] bg-white/10 border border-white/40 shadow-[inset_0_0_25px_rgba(255,255,255,0.3),_0_0_30px_rgba(255,255,255,0.1)] flex flex-col items-center justify-between overflow-hidden">
    <div class="flex justify-between w-full px-4 text-white text-lg font-bold">
    <div class="flex items-center gap-2">
    Saldo: <span id="saldo" class="text-white">$5000</span>
  </div>

  <div class="flex items-center gap-2">
    Taruhan:
    <input id="taruhan" type="number" min="100" value="100" class="px-3 py-1.5 rounded-lg text-white w-28 text-center font-semibold  bg-white/10 border border-white/20 backdrop-blur-md  placeholder-gray-300 focus:outline-none focus:ring-2 focus:ring-green-400/40 transition-all" placeholder="100" />
    <button onclick="startGame()" 
            class="ml-2 px-5 py-2 rounded-xl font-bold text-white shadow-lg hover:scale-105 transition-all bg-gradient-to-r from-green-400/40 to-green-700/40 backdrop-blur-md border border-white/20 
                   hover:from-green-400/70 hover:to-green-700/70 hover:shadow-[0_0_25px_rgba(74,222,128,0.6)]">
      Mulai
    </button>
  </div>
</div>
      <div id="colorStatusContainer" class="absolute top-6 left-6 z-40 pointer-events-none"></div>
      <div id="botHand" class="relative h-36 w-full flex items-center justify-center mb-4"></div>

      <div class="flex flex-col items-center mt-10">
        <div class="flex items-center gap-12">
          <div class="relative z-30">
            <div id="drawPile" 
                 class="relative w-[120px] h-[120px] rounded-xl cursor-pointer hover:scale-105 transition-transform duration-200 z-50">
              <img src="asset/back-card.png" class="w-full h-full rounded-xl object-contain select-none" alt="Draw Pile">
            </div>
          </div>

          <div id="discardPile" class="relative w-[140px] h-[140px] flex items-center justify-center z-20"></div>
        </div>
      </div>

      <div class="flex flex-col items-center gap-3 -mt-16">
        <div id="playerHand" class="relative h-48 w-full flex items-end justify-center"></div>
        <div class="flex justify-center gap-3 mt-8">
          <button id="unoButton" 
                  class="px-5 py-3 rounded-xl font-bold text-white shadow-lg hover:scale-105 transition-all bg-gradient-to-r from-blue-400/40 to-blue-800/40 backdrop-blur-md border border-white/20 
                        hover:from-blue-400/70 hover:to-blue-800/70 hover:shadow-[0_0_25px_rgba(59,130,246,0.6)] disabled:opacity-40 disabled:cursor-not-allowed disabled:hover:scale-100" 
                  disabled>
            UNO
          </button>

          <button id="skipButton" 
                  class="px-5 py-3 rounded-xl font-bold text-white shadow-lg hover:scale-105 transition-all bg-gradient-to-r from-gray-400/40 to-gray-700/40 backdrop-blur-md border border-white/20 hover:from-gray-400/70 hover:to-gray-700/70 
                        hover:shadow-[0_0_25px_rgba(156,163,175,0.6)] disabled:opacity-40 disabled:cursor-not-allowed disabled:hover:scale-100" 
                  disabled>
            Lewati
          </button>

          <button id="callUNOButton" 
                  class="px-5 py-3 rounded-xl font-bold text-white shadow-lg hover:scale-105 transition-all bg-gradient-to-r from-red-500/40 to-red-800/40 backdrop-blur-md border border-white/20 hover:from-red-500/70 hover:to-red-800/70 
                        hover:shadow-[0_0_25px_rgba(239,68,68,0.6)] disabled:opacity-40 disabled:cursor-not-allowed disabled:hover:scale-100" 
                  disabled>
            Panggil UNO
          </button>
        </div>

        <div class="flex gap-3 mt-6">
          <button onclick="resetGame()" 
                  class="px-6 py-2 rounded-xl font-bold text-white shadow-lg hover:scale-105 transition-all bg-gradient-to-r from-red-500/40 to-red-700/40 backdrop-blur-md border border-white/20 
                        hover:from-red-500/70 hover:to-red-700/70 hover:shadow-[0_0_25px_rgba(239,68,68,0.5)]">
            Reset Game
          </button>
        </div>
        </div>
      </div>
    </div>
  </div>

  <div id="achievementPanel" 
      class="fixed top-56 right-5 w-64 p-4 bg-white/20 rounded-xl shadow-lg text-white backdrop-blur-md z-40 border border-white/30">
    <h2 class="text-lg font-bold mb-3 text-center">🏆 Achievements</h2>
    <ul id="achievementList" class="space-y-1 text-sm"></ul>
  </div>

  <div id="achievementBox" class="fixed top-5 right-5 space-y-2 z-50"></div>

  <script src="game.js"></script>
  
</body>
</html>
